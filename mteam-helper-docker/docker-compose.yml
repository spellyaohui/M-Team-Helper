version: '3.8'

services:
  mteam-helper:
    image: spellyaohui/mteam-helper:2.0.4
    container_name: mteam-helper
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      # 数据持久化（数据库和种子文件）
      - ./data:/app/data
    environment:
      - TZ=Asia/Shanghai
      - DEBUG=False
      # M-Team API 地址（一般不需要修改）
      - MTEAM_BASE_URL=https://api.m-team.cc
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
